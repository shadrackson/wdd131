


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Table</title>
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>
    <table>
        <caption>Safety Equipment Prices</caption>
        <thead>
            <tr>
                <th>Category</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2">Safety Gear</td>
                <td>Helmet</td>
                <td>$25</td>
                <td>15</td>
            </tr>

            <tr>
                <td>Life Jacket</td>
                <td>$40</td>
                <td>10</td>
            </tr>

            <tr>
                <td rowspan="1">Clothing</td>
                <td>Gloves</td>
                <td>$10</td>
                <td>50</td>
            </tr>

            <tr>
                <td colspan="3">Total Price: 75</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
