


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles/form.css">

  <!-- JavaScript -->
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
    <p>Please share your experience with the product.</p>
  </header>

  <main>
    <form method="get" action="review.html">

      <!-- Product Name -->
       
        <label for="productName">Product Name:</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
          <!-- Options will be updated by JavaScript -->
        </select>
      

      <!-- Overall Rating -->
      <fieldset>
        <legend>Overall Rating:</legend>

        <label>
          <input type="radio" id="rating1" name="rating" value="1" required> ☆
        </label>

        <label>
          <input type="radio" id="rating2" name="rating" value="2"> ☆☆
        </label>

        <label>
          <input type="radio" id="rating3" name="rating" value="3"> ☆☆☆
        </label>

        <label>
          <input type="radio" id="rating4" name="rating" value="4"> ☆☆☆☆
        </label>

        <label>
          <input type="radio" id="rating5" name="rating" value="5"> ☆☆☆☆☆
        </label>

      </fieldset>

      <!-- Date of Installation -->
      <label for="installDate">Date of Installation:</label>
      <input type="date" id="installDate" name="installDate" required>
       

      <!-- Useful Features -->
      <fieldset>
        
        <legend>Which features did you find useful?</legend>
        <label><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>
        <label><input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use</label>
        <label><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>
        <label><input type="checkbox" id="design" name="features" value="Design"> Design</label>
      </fieldset>

      <!-- Written Review -->
      <label for="reviewText">Written Review (Optional):</label>
      <textarea id="reviewText" name="reviewText" rows="4" cols="50"></textarea>

      <!-- User Name -->
      <label for="userName">Your Name (Optional):</label>
      <input type="text" id="userName" name="userName">

      <!-- Submit -->
      <input type="submit" value="Post Review">

    </form>
  </main>

  <footer>
    <p>© <span id="currentyear"></span> Shadrack Onyango, Kenya</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>

</body>
</html>
